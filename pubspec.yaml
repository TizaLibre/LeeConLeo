name: lee_con_leo
description: "Learn to read by playing with Leo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  path: ^1.9.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/prompts/
    - assets/audio/sfx/
    - assets/audio/sounds/
    - assets/audio/words/
    - assets/content/bundle.json
    - assets/fonts/OFL.txt
    - assets/images/games/
    - assets/images/leo/
    - assets/images/scenes/
    - assets/images/steps/
    - assets/images/ui/
    - assets/images/words/
    - LICENSE
  fonts:
    - family: PlaywriteCL
      fonts:
        - asset: assets/fonts/PlaywriteCL.ttf
